<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f3524">
<title>鹿港散步籤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 安靜的陪伴，像廟口有人替你抽了一支籤。
   IDEA: 廟裡的籤筒——抽一支散步籤，小嚮導（狼耳少年）替你指路，走到了才解籤。
   PICTURE: 紅磚地上的狼耳小嚮導與地面方位環，佔首屏一半。
   COLOUR and TYPE: 鹿港紅磚為底、廟金點題、米白文字；霞鶩文楷寫籤，思源黑體寫數字。
   LAYOUT: 單欄一屏：籤況、小嚮導、距離、對話、主按鈕；解籤時整張籤卡蓋上來。 */
:root{color-scheme:light dark;
  --bg:light-dark(#9a3a27,#3b1610);--bg2:light-dark(#82301f,#2a0f0a);
  --ink:#fbf3e6;--soft:light-dark(#f3dccb,#d9bfae);--gold:#f2c14e;--gold2:#c9922a;
  --card:light-dark(#fbf3e6,#241310);--cardink:light-dark(#3a1a12,#f6e9da);--line:rgba(251,243,230,.22)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 38%,var(--bg) 0%,var(--bg2) 100%) fixed,var(--bg2);
  color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;
  -webkit-tap-highlight-color:transparent;user-select:none}
.app{min-height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--soft)}
.top b{font:700 20px/1.1 "LXGW WenKai TC",serif;color:var(--ink)}
.mode{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.hint{margin-top:14px;font:400 17px/1.4 "LXGW WenKai TC",serif;text-align:center;color:var(--soft);min-height:24px}
.stage{position:relative;flex:1 1 auto;min-height:300px;display:grid;place-items:center}
.pet{position:relative;width:min(88vw,380px);aspect-ratio:400/330}
.pet svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* 角色：一張橫排精靈圖，JS 換 background-position 換幀；腳底對齊地面環中心 (200,268) */
.kid{position:absolute;left:11.25%;top:-8.8%;width:77.5%;height:93.94%;
  background:no-repeat 0 0/400% 100%;image-rendering:auto}
.kid.flip{transform:scaleX(-1)}
.dist{text-align:center;font-weight:700;font-size:clamp(40px,12vw,56px);line-height:1.05;letter-spacing:.5px}
.dist small{font-size:18px;font-weight:500;margin-left:4px;color:var(--soft)}
.sub{text-align:center;font-size:13px;color:var(--soft);min-height:20px;margin-top:2px}
.say{margin:12px auto 0;max-width:360px;min-height:52px;text-align:center;font:400 18px/1.45 "LXGW WenKai TC",serif;
  padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.16);opacity:0;transform:translateY(6px);transition:.35s}
.say.on{opacity:1;transform:none}
.bands{display:flex;gap:8px;justify-content:center;margin-top:14px}
.bands button{flex:1;max-width:120px}
button{font:500 16px/1 "Noto Sans TC",sans-serif;color:var(--ink);background:rgba(0,0,0,.18);
  border:1px solid var(--line);border-radius:14px;min-height:46px;padding:0 14px;cursor:pointer}
button.sel{background:var(--ink);color:var(--bg2);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.main{display:block;width:100%;margin-top:12px;min-height:56px;font:700 20px/1 "LXGW WenKai TC",serif;
  background:var(--gold);color:#3a1a12;border:0;box-shadow:0 6px 0 var(--gold2)}
.main:active{transform:translateY(3px);box-shadow:0 3px 0 var(--gold2)}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
.sim{display:none;gap:8px;margin-top:10px}.sim.on{display:flex}.sim button{flex:1;font-size:15px}
.foot{margin-top:12px;text-align:center;font-size:13px;color:var(--soft)}
.foot a{color:var(--soft)}
.credit{display:block;margin-top:6px;text-align:center;font-size:11px;color:var(--soft);opacity:.55}
/* 解籤卡 */
.veil{position:fixed;inset:0;background:rgba(20,6,3,.55);display:none;place-items:center;padding:16px;z-index:5}
.veil.on{display:grid}
.card{width:min(100%,400px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);color:var(--cardink);
  border-radius:20px;padding:18px 22px 20px;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center;animation:rise .5s ease}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.card .no{font:700 15px/1 "LXGW WenKai TC",serif;color:var(--gold2);letter-spacing:4px}
.card h2{font:700 clamp(30px,9vw,40px)/1.1 "LXGW WenKai TC",serif;margin:8px 0 6px;text-wrap:balance}
.card .ph{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;margin:14px 0 0;background:rgba(0,0,0,.08)}
.card .tag{display:inline-block;font-size:13px;border:1px solid currentColor;border-radius:999px;padding:2px 10px;opacity:.7}
.card p{font:400 17px/1.6 "LXGW WenKai TC",serif;text-align:start;margin:16px 0 4px}
.card button{width:100%;margin-top:16px;background:#9a3a27;color:#fbf3e6;border:0}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b>鹿港散步籤</b><span class="mode" id="mode">尚未出發</span></div>
  <div class="hint" id="hint">選一個遠近，替你抽一支籤</div>

  <div class="stage">
    <div class="pet" id="pet" role="img" aria-label="小嚮導指著方向">
    <svg viewBox="0 0 400 330" aria-hidden="true">
      <!-- 導航箭頭：大到角色踩在上面，平躺在地面（同樣透視壓扁），以腳底為中心原地轉向目標 -->
      <g transform="translate(200 268) scale(1 .42)">
        <g id="wedge"><g transform="scale(3.4) translate(0 3)">
          <path d="M0 -38 L28 32 L0 17 L-28 32 Z" fill="none" stroke="rgba(42,13,7,.5)" stroke-width="7" stroke-linejoin="round"/>
          <path d="M0 -38 L28 32 L0 17 L-28 32 Z" fill="#f2c14e" stroke="#f2c14e" stroke-width="3" stroke-linejoin="round"/>
        </g></g>
      </g>
      <!-- 腳下影子壓在箭頭上，看起來是踩著 -->
      <ellipse cx="200" cy="268" rx="74" ry="15" fill="rgba(42,13,7,.4)"/>
      <!-- 「北」沿著環走，告訴你手機朝哪 -->
      <g transform="translate(200 268) scale(1 .42)">
        <text id="north" y="9" text-anchor="middle" font-size="24" fill="rgba(251,243,230,.7)" transform="translate(0 -172) scale(1 2.4)">北</text>
      </g>
    </svg>
    <div class="kid" id="kid"></div>
    </div>
  </div>

  <div class="dist" id="dist">？<small></small></div>
  <div class="sub" id="sub"></div>
  <div class="say" id="say"></div>

  <div class="bands" id="bands">
    <button data-b="0">近 ~500m</button><button data-b="1" class="sel">中 ~1km</button><button data-b="2">遠 ~2km</button>
  </div>
  <button class="main" id="go">抽一支籤，出發</button>
  <div class="row" id="walkrow" hidden><button id="redraw">換一支</button><button id="voice">語音：開</button><button id="stop">收工</button></div>
  <div class="sim" id="sim"><button id="stepTo">▲ 朝籤走</button><button id="stepRand">亂走</button><button id="turn">轉身 90°</button></div>
  <div class="foot" id="foot"></div>
  <a class="credit" href="https://github.com/echolupus802612/lukang-walk#資料來源與授權" target="_blank" rel="noopener">資料來源</a>
</div>

<div class="veil" id="veil"><div class="card" role="dialog" aria-modal="true" aria-labelledby="cname">
  <div class="no" id="cno">第一籤</div><h2 id="cname"></h2><span class="tag" id="ctag"></span>
  <img class="ph" id="cph" alt="" hidden>
  <p id="cdesc"></p>
  <button id="again">再抽一支</button>
</div></div>

<script>
{
const PLACES = [{"id":1,"name":"鹿港三山國王廟","lat":24.056488,"lng":120.433702,"cat":"worship","tag":"古蹟","desc":"鹿港三山國王廟創建於乾隆2年（西元1737年），廟宇的設立說明了早年即有客家人士來此開墾。","sn":"三山國王廟","ph":"文"},{"id":2,"name":"鹿港隘門","lat":24.056772,"lng":120.433032,"cat":"structure","tag":"古蹟","desc":"鹿港隘門位於鹿港鎮洛津里後車巷，為五福大街（中山路）與瑤林街、埔頭街之間。","ph":"文"},{"id":3,"name":"鹿港意和行","lat":24.056096,"lng":120.432854,"cat":"history","tag":"歷史建築","desc":"鹿港施姓族人可分為錢江（前港）與潯海（後港）兩大支派，本案鹿港意和行施家屬錢江施姓。","sn":"意和行","ph":"文"},{"id":4,"name":"鹿港蔡氏宗祠","lat":24.05605,"lng":120.434363,"cat":"worship","tag":"歷史建築","desc":"鹿港蔡氏宗祠位於不見天街的福興街上。","sn":"蔡氏宗祠","ph":"文"},{"id":5,"name":"泰安宮","lat":24.05563,"lng":120.433096,"cat":"worship","tag":"","desc":""},{"id":6,"name":"真耶穌教會","lat":24.056385,"lng":120.434683,"cat":"worship","tag":"","desc":"","ph":"共"},{"id":7,"name":"石敢當","lat":24.055402,"lng":120.433892,"cat":"history","tag":"","desc":""},{"id":8,"name":"真如殿","lat":24.05591,"lng":120.432281,"cat":"worship","tag":"","desc":"洛津里的角頭廟，主祀玄天上帝（上帝公）。"},{"id":9,"name":"振訓國術館","lat":24.057765,"lng":120.432666,"cat":"culture","tag":"","desc":""},{"id":10,"name":"埔頭街(鹿港老街)","lat":24.057044,"lng":120.431975,"cat":"structure","tag":"","desc":"三百多年前商船、行郊聚集的老街，至今還留著大戶門面和縱深很長的街屋，現在一路都是小店。","sn":"埔頭街","ph":"觀"},{"id":11,"name":"鹿港鶴棲別墅","lat":24.054968,"lng":120.43397,"cat":"history","tag":"歷史建築","desc":"鹿港鶴棲別墅創建於光緒17年（西元1891年）左右，清領時期作為錢莊使用，前段為商業空間，後段為自宅使用。","sn":"鶴棲別墅","ph":"文"},{"id":12,"name":"鹿港施進益古厝","lat":24.054809,"lng":120.433576,"cat":"history","tag":"歷史建築","desc":"施進益古厝俗稱「四快大厝」，是三棟房屋相毗連，為傳統閩南二層樓店屋建築，迄今有⼀百八十餘年歷史」。","sn":"施進益古厝","ph":"文"},{"id":13,"name":"鹿港天主教堂","lat":24.055464,"lng":120.431964,"cat":"worship","tag":"","desc":"","sn":"天主教堂","ph":"共"},{"id":14,"name":"鹿港街長宿舍","lat":24.057466,"lng":120.435303,"cat":"structure","tag":"歷史建築","desc":"鹿港街長宿舍於昭和10年（西元1935年）間興建而成，現今坐落於彰化縣鹿港鎮民權路160巷2號，西側緊鄰鹿港鎮公所，南側與鹿港地政事務所相接。","sn":"街長宿舍","ph":"文"},{"id":15,"name":"南泉宮","lat":24.056393,"lng":120.431344,"cat":"worship","tag":"","desc":"主祀普庵祖師，也供奉黃府王爺夫人。鹿港人習慣讓難帶的小孩認夫人媽當乾媽。"},{"id":16,"name":"鹿港南靖宮","lat":24.05766,"lng":120.43161,"cat":"worship","tag":"古蹟","desc":"鹿港南靖宮創建於乾隆48年（西元1783年），依「鹿港南靖宮沿革碑」碑文記載得知。","sn":"南靖宮","ph":"文"},{"id":17,"name":"鹿港玉珍齋","lat":24.05464,"lng":120.434661,"cat":"shop","tag":"歷史建築","desc":"玉珍齋是鹿港最具代表性之一的傳統糕餅店，聞名全臺。","sn":"玉珍齋","ph":"文"},{"id":18,"name":"鹿港牛墟頭景靈宮","lat":24.056515,"lng":120.435897,"cat":"worship","tag":"","desc":"原是鹿港四方土地公裡的「東方土地公」廟，咸豐年間改奉蘇府三王爺，才改名景靈宮。","sn":"牛墟頭景靈宮","ph":"共"},{"id":19,"name":"鹿港城隍廟","lat":24.05832,"lng":120.432093,"cat":"worship","tag":"古蹟","desc":"鹿港城隍廟又名「鱉亭宮」，也稱「鱉亭寺」，據傳在乾隆19年（西元1754年）創立，有「分府城隍」之稱，並有敕封「忠祐侯」的封爵。","sn":"城隍廟","ph":"文"},{"id":20,"name":"鹿港福靈宮","lat":24.058553,"lng":120.434702,"cat":"worship","tag":"","desc":"祭祀林爽文事件中抗清的王勳（王芬）。最早只是他墓旁的小祠，地方上叫「王恩大哥廟」。","sn":"福靈宮","ph":"共"},{"id":21,"name":"后宅闔港潤澤宮李殿王","lat":24.054236,"lng":120.432894,"cat":"worship","tag":"","desc":"主祀李殿王，是鹿港八郊共同祭祀的「閤港廟」之一。","ph":"共"},{"id":22,"name":"鹿港敬義園紀念碑","lat":24.054997,"lng":120.43147,"cat":"history","tag":"歷史建築","desc":"「敬義園」是清領時期鹿港地區的慈善團體，其創立於乾隆42年（西元1777年），由中國浙江紹興魏子鳴與鹿仔港巡檢王坦捐倡，得士紳林振嵩和泉廈二郊鳩資設立。","sn":"敬義園紀念碑","ph":"文"},{"id":23,"name":"九曲巷","lat":24.054186,"lng":120.434469,"cat":"structure","tag":"","desc":"本名金盛巷，紅磚巷道彎來繞去，十宜樓、意樓都藏在這一帶。","ph":"觀"},{"id":24,"name":"鹿港元昌行","lat":24.054382,"lng":120.435008,"cat":"history","tag":"歷史建築","desc":"元昌行位於今彰化縣鹿港鎮中山路188號，為昔時鹿港五福街金和興街上的商號，所在地為鹿港最主要的商業街區。","sn":"元昌行","ph":"文"},{"id":25,"name":"泊仔寮洽義堂","lat":24.057671,"lng":120.430988,"cat":"worship","tag":"","desc":"蘇府王爺廟，流傳著王爺娶妻的故事。王爺的夫人「康夫人」常被信徒請回家，安撫愛哭的孩子。","ph":"共"},{"id":26,"name":"新祖宮","lat":24.058156,"lng":120.431307,"cat":"worship","tag":"","desc":"台灣唯一由皇帝下詔、用官費蓋的媽祖廟，1788 年建。廟前立著「文武官員至此下馬」石碑。","ph":"文"},{"id":27,"name":"施姓宗祠","lat":24.059507,"lng":120.433052,"cat":"worship","tag":"","desc":"","ph":"共"},{"id":28,"name":"鹿護福宮","lat":24.054793,"lng":120.436271,"cat":"worship","tag":"","desc":"景福巷裡的角頭廟，主祀李府千歲。"},{"id":29,"name":"玉渠宮","lat":24.053435,"lng":120.433837,"cat":"worship","tag":"","desc":"主祀戲神田都元帥，清代戲班到鹿港，開演前要先來這裡「拜碼頭」。廟門用金雞、銀犬石雕代替石獅。","ph":"共"},{"id":30,"name":"鹿港辜宅","lat":24.054172,"lng":120.436195,"cat":"history","tag":"","desc":"辜顯榮家族的宅邸，1914 年起建，洋樓兩翼各有一座八角形塔樓。現在是鹿港民俗文物館，台灣第一座私人博物館。","ph":"共"},{"id":31,"name":"鹿港十宜樓","lat":24.053381,"lng":120.435194,"cat":"structure","tag":"歷史建築","desc":"慶昌全盛時期，自慶昌意樓（今中山路121號）至慶昌十宜樓（今中山路149號）間兩側街屋，可能擁有十五間店屋。","sn":"十宜樓","ph":"文"},{"id":32,"name":"鹿港天后宮","lat":24.059446,"lng":120.431209,"cat":"worship","tag":"古蹟","desc":"鹿港天后宮前身媽祖廟相傳創建年代甚早，原廟位於現址北側，古地名「船仔頭」附近（今三條巷內），奉祀天上聖母媽祖，是早年閩籍移民的守護神之一。","sn":"天后宮","ph":"文"},{"id":33,"name":"永安宮","lat":24.059039,"lng":120.430492,"cat":"worship","tag":"","desc":"主祀薛府王爺，這裡原是清代水師的營盤地。旁祀的曾大老爺是戰死的水師軍官，神像穿四品官服，考生常來拜。","ph":"觀"},{"id":34,"name":"鹿港丁家古厝","lat":24.053361,"lng":120.435737,"cat":"history","tag":"古蹟","desc":"五福街上之「新協源」丁家大宅（今彰化縣鹿港鎮中山路130、132、134號）原屬王氏所有，此店厝於道光10年（西元1830年）前已形成，據信此宅之始建時間應早於道光10年（西元18…","sn":"丁家古厝","ph":"文"},{"id":35,"name":"威靈廟(鹿港大將爺)","lat":24.052753,"lng":120.432574,"cat":"worship","tag":"","desc":"地方上叫「大將爺廟」，主祀的大將爺相傳是明朝將軍劉綎。鹿港八景十二勝的「威靈謁刀」說的就是這裡。","sn":"威靈廟","ph":"共"},{"id":36,"name":"鹿港陸濟堂","lat":24.058207,"lng":120.429651,"cat":"worship","tag":"","desc":"","sn":"陸濟堂","ph":"共"},{"id":37,"name":"集英宮","lat":24.058783,"lng":120.430008,"cat":"worship","tag":"","desc":"由三座小廟合併而成，主祀玄天上帝。1927 年惠安船主來訪，送了一塊「德被海濱」匾。","ph":"共"},{"id":38,"name":"意樓","lat":24.052939,"lng":120.435495,"cat":"structure","tag":"","desc":"慶昌古厝裡的一座小閣樓，牆邊那棵楊桃樹，背後有一段淒美的愛情故事。","ph":"觀"},{"id":39,"name":"甕牆","lat":24.052965,"lng":120.435975,"cat":"other","tag":"","desc":"巨商顏東義宅邸圍牆的一段，牆面砌著甕，左右兩面共約 120 個，是現存最完整的一段。","ph":"觀"},{"id":40,"name":"鹿港鹽業文化館","lat":24.053199,"lng":120.436654,"cat":"culture","tag":"","desc":"","sn":"鹽業文化館"},{"id":41,"name":"鹿港日茂行","lat":24.058602,"lng":120.429252,"cat":"history","tag":"古蹟","desc":"鹿港日茂行主人林振嵩於乾隆30年（西元1765年）由中國福建泉州永寧渡海來臺，並定居鹿港，初以販鹽為業，後因經商得法而致富。","sn":"日茂行","ph":"文"},{"id":42,"name":"鹿港鳳山寺","lat":24.052029,"lng":120.434437,"cat":"worship","tag":"古蹟","desc":"清雍正年間，鹿港鳳山寺初未建廟，僅塑廣澤尊王神像，神像可能奉祀於民宅或另設置臨時祭壇。","sn":"鳳山寺","ph":"文"},{"id":43,"name":"鹿港金銀廳","lat":24.052062,"lng":120.432126,"cat":"history","tag":"歷史建築","desc":"鹿港金銀廳興建於昭和10年（西元1935年），現今位於彰化縣鹿港鎮菜園里菜園路67巷17號。","sn":"金銀廳","ph":"文"},{"id":44,"name":"鹿港興安宮","lat":24.05222,"lng":120.435677,"cat":"worship","tag":"古蹟","desc":"鹿港興安宮俗稱「興化媽祖宮」，是鹿港最早的媽祖廟之一。","sn":"興安宮","ph":"文"},{"id":45,"name":"武澤宮","lat":24.051938,"lng":120.434934,"cat":"worship","tag":"","desc":""},{"id":46,"name":"鹿港北方福德祠","lat":24.0602,"lng":120.43015,"cat":"worship","tag":"歷史建築","desc":"鹿港街鎮原有四方土地公廟，分居鹿港街廓的東西南北四個方位，福德祠為「北土地公廟」，也是碩果僅存且原貌保存最完整的土地公廟，餘三位土地公廟不是轉為其他廟宇的陪祀神祇（東、西土地公廟）…","sn":"北方福德祠","ph":"文"},{"id":47,"name":"摸乳巷","lat":24.051682,"lng":120.432559,"cat":"structure","tag":"","desc":"長約 80 公尺，最窄處只有約 70 公分，兩人迎面只能側身擦過。原本是兩排房子之間的排水溝。","ph":"觀"},{"id":48,"name":"本壇宮","lat":24.051418,"lng":120.434499,"cat":"worship","tag":"","desc":""},{"id":49,"name":"郭厝保安宮","lat":24.061621,"lng":120.432255,"cat":"worship","tag":"","desc":"郭姓宗族的廟，主祀廣澤尊王與郭子儀。相傳前身是清真寺，郭姓宗親至今祭祖仍不用豬肉。","ph":"共"},{"id":50,"name":"鎮安宮","lat":24.051722,"lng":120.43642,"cat":"worship","tag":"","desc":"中山路上的角頭廟，主祀李府千歲。"},{"id":51,"name":"鹿港紫極殿","lat":24.050913,"lng":120.433395,"cat":"worship","tag":"","desc":"菜園里的上帝公廟，門神是彩繪名師郭新林的作品，已被指定為一般古物。","sn":"紫極殿","ph":"共"},{"id":52,"name":"鹿港龍山寺","lat":24.050366,"lng":120.434931,"cat":"worship","tag":"古蹟","desc":"台灣清領時期較著名的龍山寺共有五座，由北至南依序為咸豐8年（1858年）年的淡水龍山寺、乾隆3年（1738年）年的萬華龍山寺、乾隆41年（1776年）年的鹿港龍山寺、雍正年間的台南…","sn":"龍山寺","ph":"文"},{"id":53,"name":"中央廣播電臺鹿港分臺暨周遭廣播設施地景文化景觀","lat":24.059991,"lng":120.427346,"cat":"nature","tag":"文化景觀","desc":"「中央廣播電臺」成立於民國17年（西元1928年）的南京丁家橋，民國38年（西元1949年）隨中國國民黨來臺，更名為「中國廣播公司」；民國69年（西元1980年）中央廣播電臺改隸國…","sn":"中央廣播電臺鹿港分臺","ph":"文"},{"id":54,"name":"鹿港金門舘","lat":24.050017,"lng":120.435435,"cat":"structure","tag":"古蹟","desc":"臺灣有三座金門舘，分別位於艋舺（萬華）、臺南安平及鹿港。","sn":"金門館","ph":"文"},{"id":55,"name":"文德宮","lat":24.049598,"lng":120.436155,"cat":"worship","tag":"","desc":"祭祀溫府王爺三兄弟與三位夫人，信徒會來向夫人求姻緣。舊廟在九二一地震後拆除重建。","ph":"共"},{"id":57,"name":"台灣基督長老教會鹿港教會","lat":24.05068,"lng":120.439139,"cat":"worship","tag":"","desc":"","ph":"共"},{"id":58,"name":"鹿港生態公園","lat":24.064252,"lng":120.43689,"cat":"nature","tag":"","desc":"","sn":"生態公園"},{"id":59,"name":"鹿港地藏王廟","lat":24.048329,"lng":120.436658,"cat":"worship","tag":"古蹟","desc":"地藏王廟位於昔稱菜園之地，北接車圍、南聯寺口、西側為鹿港溪、東側為大眾爺塚。","sn":"地藏王廟","ph":"文"},{"id":60,"name":"文開書院","lat":24.048789,"lng":120.438152,"cat":"history","tag":"","desc":"1828 年落成的書院，名字紀念為台灣帶來教化的沈光文。1975 年失火後重建，只剩山門是道光年間的原物。","ph":"共"},{"id":61,"name":"福興鄉農會碾米廠暨穀倉","lat":24.049428,"lng":120.43994,"cat":"structure","tag":"歷史建築","desc":"福興鄉農會成立於大正13年（西元1924年），當時稱為「有限責任福興信用組合」，隸屬於臺中州「臺灣總督府農商局食糧部臺中事務所」，並配合臺灣總督府推動糧食增產政策，逐步興建穀倉及相…","sn":"福興鄉農會碾米廠","ph":"文"},{"id":62,"name":"頂厝公園","lat":24.055115,"lng":120.443617,"cat":"structure","tag":"","desc":""},{"id":63,"name":"鹿港文武廟","lat":24.04868,"lng":120.439097,"cat":"worship","tag":"古蹟","desc":"鹿港文武廟為三合一式的傳統文教祭祀空間，以文開書院居左、文祠居中、武廟居右等三個建築體組成的一大建築群，故統稱為「文武廟」。","sn":"文武廟","ph":"文"},{"id":64,"name":"橋頭太興宮","lat":24.05094,"lng":120.441752,"cat":"worship","tag":"","desc":""},{"id":65,"name":"鹿港護安宮","lat":24.047099,"lng":120.438163,"cat":"worship","tag":"","desc":"主祀吳府王爺，相傳曾跟著華佗學醫。元宵節時，旁邊的楊橋公園會擺出大型花燈。","sn":"護安宮","ph":"共"},{"id":66,"name":"楊橋公園","lat":24.046799,"lng":120.437906,"cat":"structure","tag":"","desc":"楊橋原是跨過舊鹿港溪的一座木橋，「楊橋踏月」是鹿港八景之一。","ph":"觀"},{"id":67,"name":"慈普寺","lat":24.056657,"lng":120.445467,"cat":"worship","tag":"","desc":"頂厝里的佛寺，主祀釋迦牟尼佛。"},{"id":69,"name":"同安寮福安宮","lat":24.030107,"lng":120.440994,"cat":"worship","tag":"","desc":"主祀池府千歲。"},{"id":70,"name":"原彰化飛行場防空塔（番婆及外埔）","lat":24.042994,"lng":120.462769,"cat":"structure","tag":"歷史建築","desc":"又因外觀造型特殊，不僅為辨識原彰化飛行場位置的重要地標，亦見證彰化地區於第二次世界大戰末期的軍事設施發展。","sn":"原彰化飛行場防空塔","ph":"文"}];

  bye:['今天就走到這吧。','下次再一起抽一支。']
};
/* 角色動作：每種一張橫排精靈圖。seq＝播放順序，ms＝每幀毫秒 */
const ANIM = {
  idle:   {n:4, ms:260, seq:[0,0,0,1,1,0,0,2,0,0,3,3]},
  walk:   {n:4, ms:150, seq:[0,1,2,3]},
  point:  {n:2, ms:420, seq:[0,1]},
  pointup:{n:2, ms:420, seq:[0,1]},
  pull:   {n:4, ms:220, seq:[0,1,2,3]},
  care:   {n:4, ms:380, seq:[0,1,2,3]},
  cheer:  {n:4, ms:170, seq:[0,1,2,3]},
  bye:    {n:4, ms:300, seq:[0,1,2,3]}
};
for (const k in ANIM){ const im=new Image(); im.src=`sprites/${k}.webp`; }  // 先載好，換動作不閃
const still = matchMedia('(prefers-reduced-motion: reduce)');
const $ = id => document.getElementById(id);
const store = {get(k,d){try{const v=localStorage.getItem('lkwalk_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('lkwalk_'+k,JSON.stringify(v))}catch(e){}}};
/* 足跡分兩本：實走一本、模擬一本，模擬走到的地方不會讓你在鹿港實走時抽不到 */
const rec = (k,d=[]) => store.get((S.sim?'sim_':'')+k, d);
const recSet = (k,v) => store.set((S.sim?'sim_':'')+k, v);
// v2 之前沒分本，那時還沒有人實走過，舊紀錄都是模擬，一次搬進模擬本
if (store.get('ver',1) < 2){
  for (const k of ['seen','recent','drawn']){ const v=store.get(k,null); if (v!==null){ store.set('sim_'+k,v); try{localStorage.removeItem('lkwalk_'+k)}catch(e){} } }
  store.set('ver',2);
}

/* ---------- 幾何 ---------- */
const R = 6371000, rad = x => x*Math.PI/180;
function dist(a,b){const p1=rad(a[0]),p2=rad(b[0]),dp=p2-p1,dl=rad(b[1]-a[1]);
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function bearing(a,b){const p1=rad(a[0]),p2=rad(b[0]),dl=rad(b[1]-a[1]);
  const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)*180/Math.PI+360)%360}
function move(p,deg,m){const d=m/R,b=rad(deg),la=rad(p[0]),lo=rad(p[1]);
  const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b));
  const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));
  return [la2*180/Math.PI,lo2*180/Math.PI]}
const norm180 = a => ((a%360)+540)%360-180;
const fmt = m => m>=1000?[(m/1000).toFixed(1),'公里']:[String(Math.round(m)),'公尺'];

/* ---------- 抽籤：環帶內按距離加權，近的機率高，避開剛去過的 ----------
   選的距離內沒有地點就不硬抽：回傳 {none, near}，讓玩家自己決定要不要走遠 */
function draw(pos, band){
  const recent = rec('recent'), cur = S.target && S.target.id;
  const all = PLACES.map(p=>({p,d:dist(pos,[p.lat,p.lng])})).filter(x=>x.p.id!==cur && x.d>=60);
  let pool = all.filter(x=>!recent.includes(x.p.id));
  if (!pool.length) pool = all;
  const b = BANDS[band];
  let ring = pool.filter(x=>x.d>=b.min && x.d<=b.max);
  if (ring.length<4) ring = pool.filter(x=>x.d<=b.max);
  if (!ring.length) return {none:true, near: pool.sort((a,b)=>a.d-b.d)[0] || null};
  const w = ring.map(x=>1/Math.max(x.d,120)**2), sum = w.reduce((a,c)=>a+c,0);
  let r = Math.random()*sum;
  for (let i=0;i<ring.length;i++){ if((r-=w[i])<=0) return ring[i]; }
  return ring[ring.length-1];
}

/* ---------- 狀態 ---------- */
const S = {phase:'ready', band:1, pos:null, acc:0, heading:null, sim:false, target:null, startD:0,
  shown:0, voice:store.get('voice',true), last:{}, lastMoveAt:Date.now(), saidHalf:false, saidNear:false,
  behindSince:0, lastFarAt:0, watch:null, lock:null, act:null, actUntil:0, anim:'', animAt:0, flip:false,
  fixAt:0, hitFix:0, hits:0, cardT:0, offer:null, forcedSim:false};
// 一次性動作（關心、不捨）：播 ms 毫秒後回到依情境決定的動作
function act(name, ms){ S.act=name; S.actUntil=Date.now()+ms; }

/* 語音：先播預錄的 Breeze 音檔（voice/<事件>_<第幾句>.mp3，到達是 voice/arrived_<地點id>.mp3）；
   載不到或被擋才退回瀏覽器內建 TTS。同一個 <audio> 重複用，第一次在點擊裡播放後 iOS 才放行之後的播放 */
const voiceEl = new Audio(); voiceEl.preload = 'auto';
function speak(line, src){
  if (!S.voice) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const fallback = ()=>{ if (!('speechSynthesis' in window)) return; try{
    const u = new SpeechSynthesisUtterance(line); u.lang='zh-TW'; u.rate=1; u.pitch=1.1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} };
  voiceEl.onerror = fallback;
  voiceEl.src = src; voiceEl.currentTime = 0;
  const p = voiceEl.play(); if (p && p.catch) p.catch(e=>{ if (e && e.name!=='AbortError') fallback(); });
}
const URGENT = {greet:1, arrived:1, bye:1};   // 這幾句可以打斷正在講的話，其他的等講完
function say(ev, vars={}){
  const now = Date.now(); if (S.last[ev] && now-S.last[ev] < 12000) return false;
  if (!URGENT[ev] && S.voice && !voiceEl.paused && !voiceEl.ended) return false;
  S.last[ev]=now;
  const list = LINES[ev], i = Math.floor(Math.random()*list.length);
  const line = list[i].replace('{name}', vars.name||'');
  const el = $('say'); el.textContent = line; el.classList.add('on');
  clearTimeout(say.t); say.t = setTimeout(()=>el.classList.remove('on'), 5000);
  speak(line, ev==='arrived' ? `voice/arrived_${vars.id}.mp3` : `voice/${ev}_${i}.mp3`);
  return true;
}

/* ---------- 定位與指南針 ---------- */
function onOrient(e){
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
  else if (e.absolute && typeof e.alpha === 'number') h = 360 - e.alpha;
  if (h==null) return;
  const so = (screen.orientation && screen.orientation.angle) || 0;
  if (S.heading==null && !S.sim && S.started) $('mode').textContent = 'GPS 實走';   // 指南針晚一點才醒
  S.heading = (h + so + 360) % 360;
}
const orientEv = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
// 收工、轉模擬時把定位、指南針、螢幕常亮都關掉；下次出發重新取得（臨時定位失敗的人也能重試）
function stopSensors(){
  if (S.watch!==null){ try{ navigator.geolocation.clearWatch(S.watch); }catch(e){} S.watch=null; }
  removeEventListener(orientEv, onOrient);
  if (S.lock){ try{ S.lock.release(); }catch(e){} } S.lock=null;
  S.anchor=null; S.acc=0;
  if (!S.sim) S.heading=null;
}
async function startSensors(){
  try{ if (typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      const r = await DeviceOrientationEvent.requestPermission(); if (r!=='granted') throw 0; } }catch(e){}
  addEventListener(orientEv, onOrient);
  return new Promise(res=>{
    if (!navigator.geolocation) return res(false);
    let done=false; const t=setTimeout(()=>{if(!done){done=true;res(false)}},12000);
    try{
      S.watch = navigator.geolocation.watchPosition(p=>{
        const np=[p.coords.latitude,p.coords.longitude]; S.acc=p.coords.accuracy;
        // 跟「上次確認移動的位置」比，而不是上一筆：步行每秒約 1.3m，逐筆比永遠過不了門檻
        if (!S.anchor || dist(S.anchor,np)>4 || p.coords.speed>0.6){ if (S.anchor) S.lastMoveAt=Date.now(); S.anchor=np; }
        if (!S.sim){ S.pos=np; S.fixAt++; }
        if(!done){done=true;clearTimeout(t);res(true)}
        tick();
      },()=>{if(!done){done=true;clearTimeout(t);res(false)}},{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
    }catch(e){ done=true; clearTimeout(t); res(false); }
  });
}
function useSim(reason){
  stopSensors();   // 模擬時方向由模擬按鈕決定，不讓真的指南針搶
  S.sim = true; S.acc = 5; if (S.heading==null) S.heading = 0;
  const tm = PLACES.find(p=>p.name.includes('天后宮')) || {lat:LUKANG[0],lng:LUKANG[1]};
  S.pos = move([tm.lat,tm.lng], 200, 30);
  $('sim').classList.add('on'); $('mode').textContent='模擬行走';
  $('foot').textContent = reason;
}

/* ---------- 流程 ---------- */
async function go(){
  if (S.phase==='ready' && !S.started){
    S.started = true; $('go').disabled = true; $('go').textContent='找方向中…';
    say('greet'); // 在點擊裡先開口，iOS 才肯放聲音
    const ok = S.sim ? true : await startSensors();
    if (!S.sim){
      if (!ok) useSim('拿不到定位（需要 HTTPS 網址並允許定位），先在天后宮前模擬走走。');
      else if (dist(S.pos,LUKANG)>8000) useSim('你現在不在鹿港，先用天后宮前的位置模擬。');
      else { $('mode').textContent = S.heading==null?'GPS（無指南針）':'GPS 實走'; $('foot').textContent=''; }
    }
    try{ if (navigator.wakeLock) S.lock = await navigator.wakeLock.request('screen'); }catch(e){}
    $('go').disabled=false;
  }
  pick();
}
function pick(){
  // 上一次說「這個距離內沒有」，玩家按了「那就走遠一點」→ 直接去最近那處
  const x = (S.offer && S.phase==='ready') ? S.offer : draw(S.pos, S.band);
  S.offer = null;
  if (x.none){
    if (S.phase==='walking'){ $('sub').textContent = '這個距離內沒有別支籤了'; return; }
    const n = x.near;
    S.offer = n;
    $('hint').textContent = n ? `這個距離內沒有籤，最近一處約 ${fmt(n.d).join(' ')}` : '附近沒有可以抽的地方';
    $('go').textContent = n ? '那就走遠一點' : '抽一支籤，出發';
    return;
  }
  try{ const pre = new Audio(); pre.preload='auto'; pre.src=`voice/arrived_${x.p.id}.mp3`; }catch(e){}
  if (x.p.ph){ const im = new Image(); im.src = `photos/${x.p.id}.webp`; }   // 走路時先載好，到了直接顯示
  S.target = x.p; S.startD = x.d; S.saidHalf = S.saidNear = false; S.phase='walking'; S.pickAt = Date.now(); S.lastFarAt = Date.now();
  S.hits = 0;
  recSet('drawn', rec('drawn',0)+1);
  $('hint').textContent = '籤上寫著：' + (HINT[x.p.cat]||HINT.other);
  $('bands').hidden = true; $('go').hidden = true; $('walkrow').hidden = false;
  tick(true);
}
function arrive(){
  S.phase='arrived'; const t=S.target; clearInterval(simT); simT=null;
  $('walkrow').hidden = true; $('sim').classList.remove('on');   // 歡呼的 1.8 秒內不能再換籤或收工
  const seen = rec('seen'); if(!seen.includes(t.id)){seen.push(t.id);recSet('seen',seen)}
  const recent = [t.id,...rec('recent').filter(i=>i!==t.id)].slice(0,12); recSet('recent',recent);
  try{ navigator.vibrate && navigator.vibrate([60,40,120]); }catch(e){}
  say('arrived',{name:t.sn||t.name, id:t.id});
  const n = seen.length, cn='一二三四五六七八九十';
  $('cno').textContent = '第' + (n<=10?cn[n-1]:n) + '籤';
  $('cname').textContent = t.name;
  $('ctag').textContent = TAG[t.tag] || HINT[t.cat] || '';
  $('cdesc').textContent = t.desc || '沒有留下說明的地方。站一下，看看它現在的樣子。';
  const ph = $('cph');   // 有官方照片就放在地名下面，沒有就整塊不出現
  if (t.ph){ ph.src = `photos/${t.id}.webp`; ph.alt = t.name + '的照片'; ph.hidden = false; }
  else { ph.hidden = true; ph.removeAttribute('src'); }
  // 資料與照片出處暫不放在畫面上（出處紀錄在 README、data/photos.json），做成 App 時另設頁面
  clearTimeout(S.cardT);
  S.cardT = setTimeout(()=>{ if (S.phase!=='arrived') return; $('veil').classList.add('on'); $('again').focus(); }, 1800);   // 先讓他歡呼兩輪再蓋上籤卡
}
function reset(){
  clearTimeout(S.cardT); S.cardT=0;
  $('veil').classList.remove('on'); S.phase='ready'; S.target=null; S.offer=null;
  $('bands').hidden=false; $('go').hidden=false; $('go').textContent='再抽一支'; $('walkrow').hidden=true;
  $('sim').classList.toggle('on', S.sim);
  $('hint').textContent='選一個遠近，替你抽一支籤'; $('dist').innerHTML='？<small></small>'; $('sub').textContent=statLine();
}
const statLine = () => `${S.sim?'模擬：':''}抽過 ${rec('drawn',0)} 支 · 到過 ${rec('seen').length} 處`;

/* ---------- 每次位置變化 ---------- */
function tick(first){
  if (S.phase!=='walking' || !S.pos || !S.target) return;
  const tp=[S.target.lat,S.target.lng], d=dist(S.pos,tp);
  const [n,u]=fmt(d); $('dist').innerHTML=''; $('dist').append(n); const sm=document.createElement('small'); sm.textContent=u; $('dist').append(sm);
  const blind = S.heading==null;
  $('sub').textContent = S.acc>35 ? `定位誤差約 ${Math.round(S.acc)} 公尺`
    : blind ? `沒有指南針・目標在${DIR8[Math.round(bearing(S.pos,tp)/45)%8]}方` : statLine();
  if (S.acc>60 && say('weak')) act('care', 4000);
  /* 到達：定位夠準（誤差 ≤ ACC_OK），而且連續兩筆不同的定位都在範圍內才算，避免一筆亂跳的定位就解籤。
     門檻還要在鹿港巷弄裡實測校準 */
  if (d <= Math.min(ARRIVE+S.acc/2,40)){
    if (S.sim) return arrive();
    if (S.acc > ACC_OK){ S.hits=0; $('sub').textContent='已經很近了，等定位準一點…'; return; }
    if (S.fixAt !== S.hitFix){ S.hitFix = S.fixAt; S.hits++; }
    if (S.hits >= 2) return arrive();
    $('sub').textContent='已經很近了，確認位置中…'; return;
  }
  S.hits = 0;
  const now=Date.now();
  if (!first && !S.saidHalf && d < S.startD/2 && S.startD>300){ S.saidHalf=true; say('half'); }
  else if (!S.saidNear && d < 80){ S.saidNear=true; say('near'); }
  else if (d>250 && now-S.lastFarAt>90000){ S.lastFarAt=now; say('far'); }
}

/* ---------- 畫面：每幀把相對角度餵給地面環與小嚮導 ---------- */
function frame(){
  const t0 = performance.now();
  let rel = 0;
  const blind = S.heading==null;   // 沒有可靠朝向：箭頭改成「上方是北」的絕對方位，不講左右、不叫人轉身
  if (S.target && S.pos){
    const b = bearing(S.pos,[S.target.lat,S.target.lng]);
    rel = norm180(b - (S.heading||0));
    if (S.phase==='walking' && !blind && Math.abs(rel)>120){
      if (!S.behindSince) S.behindSince=Date.now(); else if (Date.now()-S.behindSince>3500) say('behind');
    } else S.behindSince=0;
  }
  S.shown = norm180(S.shown + norm180(rel - S.shown) * 0.12);   // 收回 ±180，不然轉幾圈會累積成 -270° 被當成「在背後」
  const a = S.shown;
  $('wedge').setAttribute('transform', `rotate(${a.toFixed(1)})`);
  const nh = rad(-(S.heading||0));   // 「北」字沿著地面環走，告訴你手機朝哪
  $('north').setAttribute('transform', `translate(${(172*Math.sin(nh)).toFixed(1)} ${(-172*Math.cos(nh)).toFixed(1)}) scale(1 2.4)`);
  if (S.phase==='walking' && Date.now()-S.lastMoveAt>45000){ S.lastMoveAt=Date.now(); if (say('idle')) act('care', 5000); }
  pose(a, t0, blind);
  requestAnimationFrame(frame);
}

/* ---------- 角色：依情境挑動作 ----------
   到了→歡呼；收工→不捨；停太久或訊號差→關心（一次性）
   走路中：目標在背後→拉扯；在側邊→指方向；在前方且在走→走動；在前方但停著→先指前方，久了就停下等 */
function pose(a, t0, blind){
  const now = Date.now(), ar = Math.abs(a);
  let name = 'idle', flip = false;
  if (S.phase==='arrived') name = 'cheer';
  else if (S.act && now < S.actUntil) name = S.act;
  else if (S.phase==='walking' && S.target){
    if (!blind && ar > 120){ name = 'pull'; flip = a > 0; }          // 素材往左拉；目標在右後方就鏡像
    else if (!blind && ar > 35){ name = 'point'; flip = a < 0; }      // 素材指右；目標在左就鏡像
    else if (now - S.lastMoveAt < (S.sim ? 1500 : 6000)) name = 'walk';   // GPS 約每 3 秒才確認一次移動
    else if (now - Math.max(S.lastMoveAt, S.pickAt||0) < 15000) name = 'pointup';
  }
  const k = $('kid'), A = ANIM[name];
  if (name !== S.anim){
    S.anim = name; S.animAt = t0;
    k.style.backgroundImage = `url(sprites/${name}.webp)`;
    k.style.backgroundSize = `${A.n*100}% 100%`;
  }
  if (flip !== S.flip){ S.flip = flip; k.classList.toggle('flip', flip); }
  const i = still.matches ? 0 : A.seq[Math.floor((t0 - S.animAt) / A.ms) % A.seq.length];
  k.style.backgroundPosition = `${A.n>1 ? i/(A.n-1)*100 : 0}% 0`;
}

/* ---------- 模擬：每 100ms 走一步（加速 8 倍） ---------- */
let simT=null;
function hold(btn, fn){
  const start=e=>{e.preventDefault(); if(simT) return; S.lastMoveAt=Date.now(); simT=setInterval(fn,100)};
  const end=()=>{clearInterval(simT); simT=null};
  btn.addEventListener('pointerdown',start); ['pointerup','pointerleave','pointercancel'].forEach(t=>btn.addEventListener(t,end));
}
// 模擬時，人面向自己走的方向（手機跟著轉），方向判斷才合理
hold($('stepTo'), ()=>{ if(S.phase!=='walking') return; const b=bearing(S.pos,[S.target.lat,S.target.lng]);
  const dir=b+(Math.random()-.5)*50; S.heading=(S.heading+norm180(dir-S.heading)*.25+360)%360;
  S.pos=move(S.pos, dir, 1.2); S.lastMoveAt=Date.now(); tick(); });
let randDir = Math.random()*360;
hold($('stepRand'), ()=>{ if(S.phase!=='walking') return; randDir += (Math.random()-.5)*30; S.heading=(randDir+360)%360;
  S.pos=move(S.pos, randDir, 1.2); S.lastMoveAt=Date.now(); tick(); });
$('turn').onclick = ()=>{ S.heading = ((S.heading||0)+90)%360; };

/* ---------- 按鈕 ---------- */
document.querySelectorAll('#bands button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#bands button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); S.band=+b.dataset.b;
  if (S.offer){ S.offer=null; $('hint').textContent='選一個遠近，替你抽一支籤'; $('go').textContent = S.started?'再抽一支':'抽一支籤，出發'; } });
$('go').onclick = go;
$('redraw').onclick = pick;
// 收工＝結束這趟散步：關定位、指南針和螢幕常亮；下次出發重新取得
$('stop').onclick = ()=>{ say('bye'); act('bye', 3200);
  S.started = false; stopSensors();
  if (!S.forcedSim){ S.sim = false; $('foot').textContent = ''; }
  reset(); $('go').textContent = '抽一支籤，出發'; $('mode').textContent = S.sim ? '模擬行走' : '已收工'; };
$('again').onclick = reset;
$('voice').textContent = '語音：'+(S.voice?'開':'關');
$('voice').onclick = ()=>{ S.voice=!S.voice; store.set('voice',S.voice); $('voice').textContent='語音：'+(S.voice?'開':'關');
  if(!S.voice){ try{speechSynthesis.cancel()}catch(e){} voiceEl.pause(); } };
document.addEventListener('visibilitychange', async ()=>{ if(document.visibilityState==='visible' && S.lock!==null && S.phase==='walking'){
  try{ S.lock = await navigator.wakeLock.request('screen'); }catch(e){} } });
if (location.hash==='#sim'){ S.forcedSim = true; useSim('模擬模式：按住「朝籤走」前進。'); }
$('sub').textContent = statLine();
$('foot').textContent ||= `鹿港鎮內 ${PLACES.length} 個地點`;
requestAnimationFrame(frame);
}
</script>
</body>
</html>
