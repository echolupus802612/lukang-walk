<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f3524">
<title>鹿港散步籤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 安靜的陪伴，像廟口有人替你抽了一支籤。
   IDEA: 廟裡的籤筒——抽一支散步籤，小嚮導（狼耳少年）替你指路，走到了才解籤。
   PICTURE: 紅磚地上的狼耳小嚮導與地面方位環，佔首屏一半。
   COLOUR and TYPE: 鹿港紅磚為底、廟金點題、米白文字；霞鶩文楷寫籤，思源黑體寫數字。
   LAYOUT: 單欄一屏：籤況、小嚮導、距離、對話、主按鈕；解籤時整張籤卡蓋上來。 */
:root{color-scheme:light dark;
  --bg:light-dark(#9a3a27,#3b1610);--bg2:light-dark(#82301f,#2a0f0a);
  --ink:#fbf3e6;--soft:light-dark(#f3dccb,#d9bfae);--gold:#f2c14e;--gold2:#c9922a;
  --card:light-dark(#fbf3e6,#241310);--cardink:light-dark(#3a1a12,#f6e9da);--line:rgba(251,243,230,.22)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 38%,var(--bg) 0%,var(--bg2) 100%) fixed,var(--bg2);
  color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;
  -webkit-tap-highlight-color:transparent;user-select:none}
.app{min-height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--soft)}
.top b{font:700 20px/1.1 "LXGW WenKai TC",serif;color:var(--ink)}
.mode{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.hint{margin-top:14px;font:400 17px/1.4 "LXGW WenKai TC",serif;text-align:center;color:var(--soft);min-height:24px}
.stage{position:relative;flex:1 1 auto;min-height:300px;display:grid;place-items:center}
.pet{position:relative;width:min(88vw,380px);aspect-ratio:400/330}
.pet svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pet .over{pointer-events:none}
/* 角色：一張橫排精靈圖，JS 換 background-position 換幀；腳底對齊地面環中心 (200,268) */
.kid{position:absolute;left:20.25%;top:12.1%;width:59.5%;height:72.1%;
  background:no-repeat 0 0/400% 100%;image-rendering:auto}
.kid.flip{transform:scaleX(-1)}
.dist{text-align:center;font-weight:700;font-size:clamp(40px,12vw,56px);line-height:1.05;letter-spacing:.5px}
.dist small{font-size:18px;font-weight:500;margin-left:4px;color:var(--soft)}
.sub{text-align:center;font-size:13px;color:var(--soft);min-height:20px;margin-top:2px}
.say{margin:12px auto 0;max-width:360px;min-height:52px;text-align:center;font:400 18px/1.45 "LXGW WenKai TC",serif;
  padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.16);opacity:0;transform:translateY(6px);transition:.35s}
.say.on{opacity:1;transform:none}
.bands{display:flex;gap:8px;justify-content:center;margin-top:14px}
.bands button{flex:1;max-width:120px}
button{font:500 16px/1 "Noto Sans TC",sans-serif;color:var(--ink);background:rgba(0,0,0,.18);
  border:1px solid var(--line);border-radius:14px;min-height:46px;padding:0 14px;cursor:pointer}
button.sel{background:var(--ink);color:var(--bg2);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.main{display:block;width:100%;margin-top:12px;min-height:56px;font:700 20px/1 "LXGW WenKai TC",serif;
  background:var(--gold);color:#3a1a12;border:0;box-shadow:0 6px 0 var(--gold2)}
.main:active{transform:translateY(3px);box-shadow:0 3px 0 var(--gold2)}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
.sim{display:none;gap:8px;margin-top:10px}.sim.on{display:flex}.sim button{flex:1;font-size:15px}
.foot{margin-top:12px;text-align:center;font-size:13px;color:var(--soft)}
.foot a{color:var(--soft)}
/* 解籤卡 */
.veil{position:fixed;inset:0;background:rgba(20,6,3,.55);display:none;place-items:center;padding:16px;z-index:5}
.veil.on{display:grid}
.card{width:min(100%,400px);background:var(--card);color:var(--cardink);border-radius:20px;padding:26px 22px 20px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center;animation:rise .5s ease}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.card .no{font:700 15px/1 "LXGW WenKai TC",serif;color:var(--gold2);letter-spacing:4px}
.card h2{font:700 clamp(30px,9vw,40px)/1.1 "LXGW WenKai TC",serif;margin:14px 0 8px;text-wrap:balance}
.card .tag{display:inline-block;font-size:13px;border:1px solid currentColor;border-radius:999px;padding:2px 10px;opacity:.7}
.card p{font:400 17px/1.6 "LXGW WenKai TC",serif;text-align:start;margin:16px 0 4px}
.card .src{font-size:13px;opacity:.6;margin-top:10px}
.card button{width:100%;margin-top:16px;background:#9a3a27;color:#fbf3e6;border:0}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b>鹿港散步籤</b><span class="mode" id="mode">尚未出發</span></div>
  <div class="hint" id="hint">選一個遠近，替你抽一支籤</div>

  <div class="stage">
    <div class="pet" id="pet" role="img" aria-label="小嚮導指著方向">
    <svg viewBox="0 0 400 330" aria-hidden="true">
      <defs>
        <radialGradient id="glow"><stop offset="0" stop-color="#f2c14e" stop-opacity=".55"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
      </defs>
      <!-- 地面方位環（透視壓扁），金色扇形是精確方向 -->
      <g transform="translate(200 268) scale(1 .42)">
        <circle r="150" fill="rgba(0,0,0,.18)" stroke="rgba(251,243,230,.25)" stroke-width="2"/>
        <circle r="108" fill="none" stroke="rgba(251,243,230,.12)" stroke-width="2" stroke-dasharray="4 10"/>
        <g id="wedge"><path d="M0 0 L-34 -146 A150 150 0 0 1 34 -146 Z" fill="url(#glow)"/><path d="M0 -112 L-10 -132 L10 -132 Z" fill="#f2c14e"/></g>
      </g>
      <ellipse cx="200" cy="268" rx="58" ry="12" fill="rgba(0,0,0,.35)"/>
    </svg>
    <div class="kid" id="kid"></div>
    <!-- 「北」放在最上層，轉到角色後面也看得見 -->
    <svg viewBox="0 0 400 330" class="over" aria-hidden="true">
      <g transform="translate(200 268) scale(1 .42)"><text id="north" y="9" text-anchor="middle" font-size="24" fill="rgba(251,243,230,.7)" transform="translate(0 -172) scale(1 2.4)">北</text></g>
    </svg>
    </div>
  </div>

  <div class="dist" id="dist">？<small></small></div>
  <div class="sub" id="sub"></div>
  <div class="say" id="say"></div>

  <div class="bands" id="bands">
    <button data-b="0">近 ~500m</button><button data-b="1" class="sel">中 ~1km</button><button data-b="2">遠 ~2km</button>
  </div>
  <button class="main" id="go">抽一支籤，出發</button>
  <div class="row" id="walkrow" hidden><button id="redraw">換一支</button><button id="voice">語音：開</button><button id="stop">收工</button></div>
  <div class="sim" id="sim"><button id="stepTo">▲ 朝籤走</button><button id="stepRand">亂走</button><button id="turn">轉身 90°</button></div>
  <div class="foot" id="foot"></div>
</div>

<div class="veil" id="veil"><div class="card" role="dialog" aria-modal="true" aria-labelledby="cname">
  <div class="no" id="cno">第一籤</div><h2 id="cname"></h2><span class="tag" id="ctag"></span>
  <p id="cdesc"></p><div class="src">資料：文化部文化資產局、© OpenStreetMap contributors、維基百科</div>
  <button id="again">再抽一支</button>
</div></div>

<script>
{
const PLACES = [{"id":1,"name":"鹿港三山國王廟","lat":24.056488,"lng":120.433702,"cat":"worship","tag":"古蹟","desc":"鹿港三山國王廟創建於乾隆2年（西元1737年），廟宇的設立說明了早年即有客家人士來此開墾。"},{"id":2,"name":"鹿港隘門","lat":24.056772,"lng":120.433032,"cat":"structure","tag":"古蹟","desc":"鹿港隘門位於鹿港鎮洛津里後車巷，為五福大街（中山路）與瑤林街、埔頭街之間。"},{"id":3,"name":"鹿港意和行","lat":24.056096,"lng":120.432854,"cat":"history","tag":"歷史建築","desc":"鹿港施姓族人可分為錢江（前港）與潯海（後港）兩大支派，本案鹿港意和行施家屬錢江施姓。"},{"id":4,"name":"鹿港蔡氏宗祠","lat":24.05605,"lng":120.434363,"cat":"worship","tag":"歷史建築","desc":"鹿港蔡氏宗祠位於不見天街的福興街上。"},{"id":5,"name":"泰安宮","lat":24.05563,"lng":120.433096,"cat":"worship","tag":"","desc":""},{"id":6,"name":"真耶穌教會","lat":24.056385,"lng":120.434683,"cat":"worship","tag":"","desc":""},{"id":7,"name":"石敢當","lat":24.055402,"lng":120.433892,"cat":"history","tag":"","desc":""},{"id":8,"name":"真如殿","lat":24.05591,"lng":120.432281,"cat":"worship","tag":"","desc":""},{"id":9,"name":"振訓國術館","lat":24.057765,"lng":120.432666,"cat":"culture","tag":"","desc":""},{"id":10,"name":"埔頭街(鹿港老街)","lat":24.057044,"lng":120.431975,"cat":"structure","tag":"","desc":""},{"id":11,"name":"鹿港鶴棲別墅","lat":24.054968,"lng":120.43397,"cat":"history","tag":"歷史建築","desc":"鹿港鶴棲別墅創建於光緒17年（西元1891年）左右，清領時期作為錢莊使用，前段為商業空間，後段為自宅使用。"},{"id":12,"name":"鹿港施進益古厝","lat":24.054809,"lng":120.433576,"cat":"history","tag":"歷史建築","desc":"施進益古厝俗稱「四快大厝」，是三棟房屋相毗連，為傳統閩南二層樓店屋建築，迄今有⼀百八十餘年歷史」。"},{"id":13,"name":"鹿港天主教堂","lat":24.055464,"lng":120.431964,"cat":"worship","tag":"","desc":""},{"id":14,"name":"鹿港街長宿舍","lat":24.057466,"lng":120.435303,"cat":"structure","tag":"歷史建築","desc":"鹿港街長宿舍於昭和10年（西元1935年）間興建而成，現今坐落於彰化縣鹿港鎮民權路160巷2號，西側緊鄰鹿港鎮公所，南側與鹿港地政事務所相接。"},{"id":15,"name":"南泉宮","lat":24.056393,"lng":120.431344,"cat":"worship","tag":"","desc":""},{"id":16,"name":"鹿港南靖宮","lat":24.05766,"lng":120.43161,"cat":"worship","tag":"古蹟","desc":"鹿港南靖宮創建於乾隆48年（西元1783年），依「鹿港南靖宮沿革碑」碑文記載得知。"},{"id":17,"name":"鹿港玉珍齋","lat":24.05464,"lng":120.434661,"cat":"shop","tag":"歷史建築","desc":"玉珍齋是鹿港最具代表性之一的傳統糕餅店，聞名全臺。"},{" /* ---------- 幾何 ---------- */
const R = 6371000, rad = x => x*Math.PI/180;
function dist(a,b){const p1=rad(a[0]),p2=rad(b[0]),dp=p2-p1,dl=rad(b[1]-a[1]);
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function bearing(a,b){const p1=rad(a[0]),p2=rad(b[0]),dl=rad(b[1]-a[1]);
  const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)*180/Math.PI+360)%360}
function move(p,deg,m){const d=m/R,b=rad(deg),la=rad(p[0]),lo=rad(p[1]);
  const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b));
  const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));
  return [la2*180/Math.PI,lo2*180/Math.PI]}
const norm180 = a => ((a%360)+540)%360-180;
const fmt = m => m>=1000?[(m/1000).toFixed(1),'公里']:[String(Math.round(m)),'公尺'];

/* ---------- 抽籤：環帶內按距離加權，近的機率高，避開剛去過的 ---------- */
function draw(pos, band){
  const recent = store.get('recent',[]), cur = S.target && S.target.id;
  let pool = PLACES.map(p=>({p,d:dist(pos,[p.lat,p.lng])})).filter(x=>x.p.id!==cur && !recent.includes(x.p.id));
  const b = BANDS[band];
  let ring = pool.filter(x=>x.d>=b.min && x.d<=b.max);
  if (ring.length<4) ring = pool.filter(x=>x.d<=b.max && x.d>=60);
  if (!ring.length) ring = pool.sort((a,b)=>a.d-b.d).slice(0,5);
  const w = ring.map(x=>1/Math.max(x.d,120)**2), sum = w.reduce((a,c)=>a+c,0);
  let r = Math.random()*sum;
  for (let i=0;i<ring.length;i++){ if((r-=w[i])<=0) return ring[i]; }
  return ring[ring.length-1];
}

/* ---------- 狀態 ---------- */
const S = {phase:'ready', band:1, pos:null, acc:0, heading:null, sim:false, target:null, startD:0,

function act(name, ms){ S.act=name; S.actUntil=Date.now()+ms; }

function say(ev, vars={}){
  const now = Date.now(); if (S.last[ev] && now-S.last[ev] < 12000) return false; S.last[ev]=now;
  const list = LINES[ev], line = list[Math.floor(Math.random()*list.length)]
    .replace('{d}', vars.d||'').replace('{name}', vars.name||'');
  const el = $('say'); el.textContent = line; el.classList.add('on');
  clearTimeout(say.t); say.t = setTimeout(()=>el.classList.remove('on'), 5000);
  if (S.voice && 'speechSynthesis' in window){ try{
    const u = new SpeechSynthesisUtterance(line); u.lang='zh-TW'; u.rate=1; u.pitch=1.1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }
  return true;
}

/* ---------- 定位與指南針 ---------- */
function onOrient(e){
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
  else if (e.absolute && typeof e.alpha === 'number') h = 360 - e.alpha;
  if (h==null) return;
  const so = (screen.orientation && screen.orientation.angle) || 0;
  S.heading = (h + so + 360) % 360;
}
async function startSensors(){
  try{ if (typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      const r = await DeviceOrientationEvent.requestPermission(); if (r!=='granted') throw 0; } }catch(e){}
  if ('ondeviceorientationabsolute' in window) addEventListener('deviceorientationabsolute', onOrient);
  else addEventListener('deviceorientation', onOrient);
  return new Promise(res=>{
    if (!navigator.geolocation) return res(false);
    let done=false; const t=setTimeout(()=>{if(!done){done=true;res(false)}},12000);
    try{
      S.watch = navigator.geolocation.watchPosition(p=>{
        const np=[p.coords.latitude,p.coords.longitude]; S.acc=p.coords.accuracy;
        // 跟「上次確認移動的位置」比，而不是上一筆：步行每秒約 1.3m，逐筆比永遠過不了門檻
        if (!S.anchor || dist(S.anchor,np)>4 || p.coords.speed>0.6){ if (S.anchor) S.lastMoveAt=Date.now(); S.anchor=np; }
        if (!S.sim) S.pos=np;
        if(!done){done=true;clearTimeout(t);res(true)}
        tick();
      },()=>{if(!done){done=true;clearTimeout(t);res(false)}},{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
    }catch(e){ done=true; clearTimeout(t); res(false); }
  });
}
function useSim(reason){
  S.sim = true; S.acc = 5; if (S.heading==null) S.heading = 0;
  const tm = PLACES.find(p=>p.name.includes('天后宮')) || {lat:LUKANG[0],lng:LUKANG[1]};
  S.pos = move([tm.lat,tm.lng], 200, 30);
  $('sim').classList.add('on'); $('mode').textContent='模擬行走';
  $('foot').textContent = reason;
}

/* ---------- 流程 ---------- */
async function go(){
  if (S.phase==='ready' && !S.started){
    S.started = true; $('go').disabled = true; $('go').textContent='找方向中…';
    say('greet'); // 在點擊裡先開口，iOS 才肯放聲音
    const ok = S.sim ? true : await startSensors();
    if (!S.sim){
      if (!ok) useSim('拿不到定位（需要 HTTPS 網址並允許定位），先在天后宮前模擬走走。');
      else if (dist(S.pos,LUKANG)>8000) useSim('你現在不在鹿港，先用天后宮前的位置模擬。');
      else { $('mode').textContent = S.heading==null?'GPS（無指南針）':'GPS 實走'; $('foot').textContent=''; }
    }
    try{ if (navigator.wakeLock) S.lock = await navigator.wakeLock.request('screen'); }catch(e){}
    $('go').disabled=false;
  }
  pick();
}
function pick(){
  const x = draw(S.pos, S.band);
  S.target = x.p; S.startD = x.d; S.saidHalf = S.saidNear = false; S.phase='walking'; S.pickAt = Date.now();
  store.set('drawn', store.get('drawn',0)+1);
  $('hint').textContent = '籤上寫著：' + (HINT[x.p.cat]||HINT.other);
  $('bands').hidden = true; $('go').hidden = true; $('walkrow').hidden = false;
  tick(true);
}
function arrive(){
  S.phase='arrived'; const t=S.target; clearInterval(simT); simT=null;
  const seen = store.get('seen',[]); if(!seen.includes(t.id)){seen.push(t.id);store.set('seen',seen)}
  const recent = [t.id,...store.get('recent',[]).filter(i=>i!==t.id)].slice(0,12); store.set('recent',recent);
  try{ navigator.vibrate && navigator.vibrate([60,40,120]); }catch(e){}
  say('arrived',{name:t.name});
  const n = seen.length, cn='一二三四五六七八九十';
  $('cno').textContent = '第' + (n<=10?cn[n-1]:n) + '籤';

  $('ctag').textContent = TAG[t.tag] || HINT[t.cat] || '';
  $('cdesc').textContent = t.desc || '沒有留下說明的地方。站一下，看看它現在的樣子。';
  setTimeout(()=>{$('veil').classList.add('on'); $('again').focus();}, 1800);   // 先讓他歡呼兩輪再蓋上籤卡
}
function reset(){
  $('veil').classList.remove('on'); S.phase='ready'; S.target=null;
  $('bands').hidden=false; $('go').hidden=false; $('go').textContent='再抽一支'; $('walkrow').hidden=true;
  $('hint').textContent='選一個遠近，替你抽一支籤'; $('dist').innerHTML='？<small></small>'; $('sub').textContent=statLine();
}
const statLine = () => `抽過 ${store.get('drawn',0)} 支 · 到過 ${store.get('seen',[]).length} 處`;

/* ---------- 每次位置變化 ---------- */
function tick(first){
  if (S.phase!=='walking' || !S.pos || !S.target) return;
  const tp=[S.target.lat,S.target.lng], d=dist(S.pos,tp);
  const [n,u]=fmt(d); $('dist').innerHTML=''; $('dist').append(n); const sm=document.createElement('small'); sm.textContent=u; $('dist').append(sm);
  $('sub').textContent = S.acc>35 ? `定位誤差約 ${Math.round(S.acc)} 公尺` : statLine();
  if (S.acc>60 && say('weak')) act('care', 4000);
  if (d <= Math.min(ARRIVE+S.acc/2,40)) return arrive();
  const now=Date.now();
  if (!first && !S.saidHalf && d < S.startD/2 && S.startD>300){ S.saidHalf=true; say('half'); }
  else if (!S.saidNear && d < 80){ S.saidNear=true; say('near'); }
  else if (d>250 && now-S.lastFarAt>90000){ S.lastFarAt=now; say('far',{d:fmt(d).join(' ')}); }
}

/* ---------- 畫面：每幀把相對角度餵給地面環與小嚮導 ---------- */
function frame(){
  const t0 = performance.now();
  let rel = 0;
  if (S.target && S.pos){
    const b = bearing(S.pos,[S.target.lat,S.target.lng]);
    rel = norm180(b - (S.heading||0));
    if (S.phase==='walking' && Math.abs(rel)>120){
      if (!S.behindSince) S.behindSince=Date.now(); else if (Date.now()-S.behindSince>3500) say('behind');
    } else S.behindSince=0;
  }
  S.shown = norm180(S.shown + norm180(rel - S.shown) * 0.12);   // 收回 ±180，不然轉幾圈會累積成 -270° 被當成「在背後」
  const a = S.shown;
  $('wedge').setAttribute('transform', `rotate(${a.toFixed(1)})`);
  const nh = rad(-(S.heading||0));   // 「北」字沿著地面環走，告訴你手機朝哪
  $('north').setAttribute('transform', `translate(${(172*Math.sin(nh)).toFixed(1)} ${(-172*Math.cos(nh)).toFixed(1)}) scale(1 2.4)`);
  if (S.phase==='walking' && Date.now()-S.lastMoveAt>45000){ S.lastMoveAt=Date.now(); if (say('idle')) act('care', 5000); }
  pose(a, t0);
  requestAnimationFrame(frame);
}

/* ---------- 角色：依情境挑動作 ----------
   到了→歡呼；收工→不捨；停太久或訊號差→關心（一次性）
   走路中：目標在背後→拉扯；在側邊→指方向；在前方且在走→走動；在前方但停著→先指前方，久了就停下等 */
function pose(a, t0){
  const now = Date.now(), ar = Math.abs(a);
  let name = 'idle', flip = false;
  if (S.phase==='arrived') name = 'cheer';
  else if (S.act && now < S.actUntil) name = S.act;
  else if (S.phase==='walking' && S.target){
    if (ar > 120){ name = 'pull'; flip = a > 0; }          // 素材往左拉；目標在右後方就鏡像
    else if (ar > 35){ name = 'point'; flip = a < 0; }      // 素材指右；目標在左就鏡像
    else if (now - S.lastMoveAt < (S.sim ? 1500 : 6000)) name = 'walk';   // GPS 約每 3 秒才確認一次移動
    else if (now - Math.max(S.lastMoveAt, S.pickAt||0) < 15000) name = 'pointup';
  }
  const k = $('kid'), A = ANIM[name];
  if (name !== S.anim){
    S.anim = name; S.animAt = t0;
    k.style.backgroundImage = `url(sprites/${name}.webp)`;
    k.style.backgroundSize = `${A.n*100}% 100%`;
  }
  if (flip !== S.flip){ S.flip = flip; k.classList.toggle('flip', flip); }
  const i = still.matches ? 0 : A.seq[Math.floor((t0 - S.animAt) / A.ms) % A.seq.length];
  k.style.backgroundPosition = `${A.n>1 ? i/(A.n-1)*100 : 0}% 0`;
}

/* ---------- 模擬：每 100ms 走一步（加速 8 倍） ---------- */
let simT=null;
function hold(btn, fn){
  const start=e=>{e.preventDefault(); if(simT) return; S.lastMoveAt=Date.now(); simT=setInterval(fn,100)};
  const end=()=>{clearInterval(simT); simT=null};
  btn.addEventListener('pointerdown',start); ['pointerup','pointerleave','pointercancel'].forEach(t=>btn.addEventListener(t,end));
}
// 模擬時，人面向自己走的方向（手機跟著轉），方向判斷才合理
hold($('stepTo'), ()=>{ if(S.phase!=='walking') return; const b=bearing(S.pos,[S.target.lat,S.target.lng]);
  const dir=b+(Math.random()-.5)*50; S.heading=(S.heading+norm180(dir-S.heading)*.25+360)%360;
  S.pos=move(S.pos, dir, 1.2); S.lastMoveAt=Date.now(); tick(); });
let randDir = Math.random()*360;
hold($('stepRand'), ()=>{ if(S.phase!=='walking') return; randDir += (Math.random()-.5)*30; S.heading=(randDir+360)%360;
  S.pos=move(S.pos, randDir, 1.2); S.lastMoveAt=Date.now(); tick(); });
$('turn').onclick = ()=>{ S.heading = ((S.heading||0)+90)%360; };

/* ---------- 按鈕 ---------- */
document.querySelectorAll('#bands button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#bands button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); S.band=+b.dataset.b; });
$('go').onclick = go;
$('redraw').onclick = pick;
$('stop').onclick = ()=>{ say('bye'); act('bye', 3200); reset(); };
$('again').onclick = reset;
$('voice').textContent = '語音：'+(S.voice?'開':'關');
$('voice').onclick = ()=>{ S.voice=!S.voice; store.set('voice',S.voice); $('voice').textContent='語音：'+(S.voice?'開':'關');
  if(!S.voice) try{speechSynthesis.cancel()}catch(e){} };
document.addEventListener('visibilitychange', async ()=>{ if(document.visibilityState==='visible' && S.lock!==null && S.phase==='walking'){
  try{ S.lock = await navigator.wakeLock.request('screen'); }catch(e){} } });
if (location.hash==='#sim') useSim('模擬模式：按住「朝籤走」前進。');
$('sub').textContent = statLine();
$('foot').textContent ||= `鹿港鎮內 ${PLACES.length} 個地點`;
requestAnimationFrame(frame);
}
</script>
